name: Generate paper storyboards

# 通常は「Daily paper archive」が毎日まとめて生成する。
# こちらは手動での再試行・過去日の補完用(例: DAILY_DAYS=7 で直近7日分)。
on:
  workflow_dispatch:
    inputs:
      daily_days:
        description: '何日分の新着に解説を付けるか'
        default: '1'
      per_category:
        description: '分野ごとの本数'
        default: '4'

permissions:
  contents: write
  models: read   # GitHub Models をGITHUB_TOKENで呼ぶための権限(APIキー不要)
  actions: write # 生成後にPagesデプロイをディスパッチするため

concurrency:
  group: content-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate storyboards (GitHub Models -> Gemini -> skip)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_DAYS: ${{ inputs.daily_days }}
          DAILY_PER_CATEGORY: ${{ inputs.per_category }}
        run: node scripts/generate_storyboards.mjs

      - name: Commit updated storyboards
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storyboards.json
          [ -d data/briefings ] && git add -A data/briefings
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変更なし"
          else
            git commit -m "chore: 論文ストーリーボードを自動生成"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKENによるpushはワークフローを連鎖起動しないため、Pagesデプロイを明示的に起動
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
